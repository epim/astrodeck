<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06080d" />
    <title>AstroDeck</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2306080d'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237dd3fc' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%237dd3fc'/%3E%3Cpath d='M16 3v5M16 24v5M3 16h5M24 16h5' stroke='%237dd3fc' stroke-width='1.5'/%3E%3C/svg%3E" />
    <!-- anti-flash: apply night class + dimmer vars from localStorage BEFORE first paint
         so the app never flashes day/full-brightness on a night-mode reload. -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var night = localStorage.getItem("astrodeck-night") === "1";
          if (night) d.classList.add("night");
          var clamp = function (v) { return Math.min(1, Math.max(0.08, v)); };
          var num = function (k, def) { var n = Number(localStorage.getItem(k)); return isFinite(n) && n > 0 ? n : def; };
          var b = clamp(night ? num("astrodeck-bright-night", 0.45) : num("astrodeck-bright-day", 1));
          d.style.setProperty("--screen-brightness", String(b));
          d.style.setProperty("--scrim-opacity", String(Math.min(0.92, Math.max(0, 1 - b * 1.05))));
        } catch (e) { /* localStorage may be unavailable; first paint falls back to :root defaults */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
