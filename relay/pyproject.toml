[project]
name = "astrodeck-relay"
version = "0.1.0"
description = "AstroDeck remote-access relay: outbound-WSS tunnel front door (no port-forwarding)"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.30",
    "websockets>=14.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
astrodeck-relay = "relay.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["relay*"]
