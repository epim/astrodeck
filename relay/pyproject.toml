[project]
name = "astrodeck-relay"
version = "0.1.0"
description = "AstroDeck remote-access relay: outbound-WSS tunnel front door (no port-forwarding)"
requires-python = ">=3.11"
dependencies = [
    # Pinned to an exact version (#597, backlog WP-13), identical to
    # requirements.txt: CI's relay job and deploy-relay's test job install
    # from THIS file, so a range here would let the same drift back in that
    # requirements.txt was pinned to stop (see that file's comment for the
    # incident). server/tests/test_w2_relay_requirements_pinned.py grades
    # both files line for line.
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "websockets==17.1",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
# Mirrors relay/requirements-dev.txt line for line (#629, backlog WP-71 +
# W5 integration): CI's relay job and deploy-relay's test job both
# `pip install -e ".[dev]"`, which reads THIS list, never requirements-dev.txt
# -- so pinning httpx2 only in the latter protected nothing either job
# actually installs from. test_w5_relay_dev_requirements_pinned.py grades
# both files for the same set of dev packages.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "httpx2>=2.13"]

[project.scripts]
astrodeck-relay = "relay.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["relay*"]
