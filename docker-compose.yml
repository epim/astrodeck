# Hardened loopback-only development and maintenance profile.
#
# A fresh config volume must be bootstrapped interactively before the server can
# accept its container-internal non-loopback bind:
#
#   docker compose build
#   docker compose run --rm astrodeck \
#     python -m astrodeck create-admin <username>
#   docker compose up -d
#
# This profile is intentionally reachable only from the Docker host. Use
# deploy/reverse-proxy/docker-compose.yml for a supported LAN/public deployment.

name: astrodeck-local

services:
  astrodeck:
    build: .
    image: astrodeck:latest
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_signal: SIGTERM
    stop_grace_period: 90s
    restart: unless-stopped
    ports:
      - "127.0.0.1:8800:8800"
    volumes:
      - type: volume
        source: astrodeck-config
        target: /data/config
      - type: volume
        source: astrodeck-captures
        target: /data/captures
    environment:
      ASTRODECK_CONFIG_DIR: /data/config
      ASTRODECK_CAPTURE_DIR: /data/captures
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

volumes:
  astrodeck-config:
  astrodeck-captures:
