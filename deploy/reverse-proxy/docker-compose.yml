name: astrodeck-edge

services:
  astrodeck:
    build:
      context: ../..
      dockerfile: Dockerfile
    user: "10001:10001"
    command: ["python", "-m", "astrodeck", "run", "--host", "0.0.0.0", "--port", "8800"]
    environment:
      ASTRODECK_CONFIG_DIR: /data/config
      ASTRODECK_CAPTURE_DIR: /data/captures
      ASTRODECK_FORWARDED_ALLOW_IPS: 172.30.0.2
      ASTRODECK_UVICORN_ACCESS_LOG: "false"
      ASTRODECK_REQUIRE_AUTH: "true"
      ASTRODECK_ALLOWED_HOSTS: "${ASTRODECK_PUBLIC_HOST:?Set ASTRODECK_PUBLIC_HOST}"
    expose: ["8800"]
    volumes:
      - type: volume
        source: astrodeck-config
        target: /data/config
      - type: volume
        source: astrodeck-captures
        target: /data/captures
    networks:
      backend:
        ipv4_address: 172.30.0.3
      # This project-private bridge gives the controller outbound access for
      # updates, weather, alerts, remote WSS, and explicitly addressed LAN
      # devices.  No listener is published from this network.
      egress:
        gw_priority: 1
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 256
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_signal: SIGTERM
    stop_grace_period: 90s
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  proxy:
    # Multi-architecture index digest for the reviewed official stable image.
    image: nginx:1.30.4-alpine@sha256:02b1b2a0445514891a14aa371845f6085d5d9d10d385b30d6aad606a50a29a05
    user: "101:101"
    depends_on: [astrodeck]
    environment:
      ASTRODECK_PUBLIC_HOST: "${ASTRODECK_PUBLIC_HOST:?Set ASTRODECK_PUBLIC_HOST}"
      ASTRODECK_PUBLIC_HTTPS_PORT: "${ASTRODECK_HTTPS_PORT:-8443}"
    entrypoint: ["/bin/sh", "-e", "-c"]
    command:
      - |
        case "$$ASTRODECK_PUBLIC_HOST" in
          ""|*[!A-Za-z0-9.-]*)
            echo 'ASTRODECK_PUBLIC_HOST must be one DNS hostname or IPv4 address' >&2
            exit 2
            ;;
        esac
        if [ "$${#ASTRODECK_PUBLIC_HOST}" -gt 253 ] || \
           ! printf '%s\n' "$$ASTRODECK_PUBLIC_HOST" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$$'; then
          echo 'ASTRODECK_PUBLIC_HOST must be one DNS hostname or IPv4 address' >&2
          exit 2
        fi
        case "$$ASTRODECK_PUBLIC_HTTPS_PORT" in
          ""|0|0*|*[!0-9]*)
            echo 'ASTRODECK_PUBLIC_HTTPS_PORT must be an integer from 1 to 65535' >&2
            exit 2
            ;;
        esac
        if [ "$${#ASTRODECK_PUBLIC_HTTPS_PORT}" -gt 5 ] || \
           [ "$$ASTRODECK_PUBLIC_HTTPS_PORT" -gt 65535 ]; then
          echo 'ASTRODECK_PUBLIC_HTTPS_PORT must be an integer from 1 to 65535' >&2
          exit 2
        fi
        umask 077
        envsubst '$${ASTRODECK_PUBLIC_HOST} $${ASTRODECK_PUBLIC_HTTPS_PORT}' < /etc/nginx/site.conf.template > /tmp/site.conf
        nginx -t -c /etc/nginx/nginx.conf
        exec nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
    ports:
      - target: 8080
        published: "${ASTRODECK_HTTP_PORT:-8080}"
        protocol: tcp
      - target: 8443
        published: "${ASTRODECK_HTTPS_PORT:-8443}"
        protocol: tcp
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx/astrodeck.conf.template
        target: /etc/nginx/site.conf.template
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ASTRODECK_CERT_DIR:-./certs}/fullchain.pem"
        target: /certs/fullchain.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${ASTRODECK_CERT_DIR:-./certs}/privkey.pem"
        target: /certs/privkey.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      backend:
        ipv4_address: 172.30.0.2
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    init: true
    pids_limit: 64
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

networks:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress:
    driver: bridge

volumes:
  astrodeck-config:
  astrodeck-captures:
