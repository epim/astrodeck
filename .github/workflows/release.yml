name: release

# Build all payloads first. No release upload happens unless every platform's
# native wheel and frozen artifact, plus the source tarball, pass their gates.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e "./server[dev]" PyYAML psutil setuptools wheel
      - name: Require a version tag matching the package
        shell: bash
        run: |
          python -c "import os,tomllib; from pathlib import Path; p=tomllib.loads(Path('server/pyproject.toml').read_text()); expected='v'+p['project']['version']; assert os.environ['GITHUB_REF_TYPE']=='tag' and os.environ['GITHUB_REF_NAME']==expected, 'release ref must be the matching version tag'"
      - name: Required privacy gate
        env:
          ASTRODECK_PRIVACY_NEEDLES: ${{ secrets.ASTRODECK_PRIVACY_NEEDLES }}
        run: python tools/privacy_scan.py --require
      - name: Real-I/O update apply and rollback
        working-directory: server
        run: python -m pytest -m selftest -q
      - name: Supervisor swap and rollback
        working-directory: server
        run: python -m pytest tests/test_supervisor.py tests/test_supervisor_protocol_parity.py -q
      - name: Owner policy and Docker build inputs
        run: |
          python packaging/distribution_policy.py --check-package-data
          python deploy/reverse-proxy/check_build_contexts.py
      - name: Packaging and build-input regression tests
        shell: bash
        run: |
          python -B -m unittest discover -s packaging/tests -p 'test_*.py'
          python -B -m unittest discover -s server/tests -p 'test_release_build_contexts.py'
          python -B -m unittest discover -s server/tests -p 'test_release_pipeline.py'
          python -B -m unittest discover -s tools/licence -p 'test_release_gate.py'
      - name: Existing release and licence regressions
        shell: bash
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -B -m pytest --noconftest -o addopts='' -q
          server/tests/test_build_binary_smoke.py server/tests/test_build_release*.py
          server/tests/test_release_strictness.py server/tests/test_licence_*.py
          server/tests/test_licensing.py server/tests/test_credits.py

  release:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.probe/release/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.probe/release/cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install source artifact audit dependencies
        run: python -m pip install ./server "cryptography>=50.0.0"
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Prepare the locked Cargo notice graph
        run: cargo fetch --locked --manifest-path native/Cargo.toml
      - name: Generate credits for this build environment
        run: python tools/licence/build_credits.py --out .probe/release/credits.generated.json
      - name: Build UI and record actual inputs
        run: node tools/licence/build_ui_inventory.mjs --credits .probe/release/credits.generated.json --out-dir .probe/release/ui-dist --report .probe/release/ui-inventory.json
      - name: Stage the verified UI for the source packager
        run: python -c "import shutil; shutil.copytree('.probe/release/ui-dist','ui/dist')"
      # DSS2 remains fetch-only (#198/#631). Never fetch or pass a survey pack.
      # ASTAP remains an explicitly recorded external prerequisite.
      - name: Build source release bundle
        shell: bash
        run: python scripts/build_release.py --strict --version "${GITHUB_REF_NAME#v}" --out dist --allow-missing astap
      - name: Gate every source archive member against reviewed evidence
        shell: bash
        run: python tools/licence/audit_release.py --kind source-tar --artifact "dist/astrodeck-${GITHUB_REF_NAME#v}.tar.gz" --platform linux-x86_64 --ui-inventory .probe/release/ui-inventory.json --credits .probe/release/credits.generated.json --report .probe/release/source-gate.json
      - name: Unpack the accepted source bundle for its SBOM
        shell: bash
        run: |
          mkdir sbom-src
          tar -xzf "dist/astrodeck-${GITHUB_REF_NAME#v}.tar.gz" -C sbom-src
      - name: Generate source artifact SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sbom-src
          format: cyclonedx-json
          output-file: dist/astrodeck-sbom.cdx.json
          upload-release-assets: false
      - name: Retain accepted source release files
        uses: actions/upload-artifact@v4
        with:
          name: accepted-source
          if-no-files-found: error
          path: |
            dist/astrodeck-*.tar.gz
            dist/astrodeck-sbom.cdx.json
      - name: Retain source gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-gate-report
          if-no-files-found: ignore
          path: .probe/release/source-gate.json

  binaries:
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            asset: astrodeck-linux-x86_64
            path: dist/astrodeck
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            asset: astrodeck-linux-arm64
            path: dist/astrodeck
          - os: windows-latest
            platform: windows-x86_64
            asset: astrodeck-windows-x86_64.exe
            path: dist/astrodeck.exe
          - os: macos-latest
            platform: macos-arm64
            asset: astrodeck-macos-arm64
            path: dist/astrodeck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_HOME: ${{ github.workspace }}/.probe/release/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.probe/release/cargo-target
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build and inventory dependencies
        run: python -m pip install ./server "pyinstaller>=6.0" "maturin>=1.9,<2" psutil
      - name: Build this target's ABI3 engine with notices and source
        run: python packaging/build_native.py --out dist
      - name: Install the exact native wheel before collecting credits
        shell: bash
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Generate fresh credits and audited UI
        shell: bash
        run: |
          python tools/licence/build_credits.py --out .probe/release/credits.generated.json
          node tools/licence/build_ui_inventory.mjs --credits .probe/release/credits.generated.json --out-dir .probe/release/ui-dist --report .probe/release/ui-inventory.json
          python -c "import shutil; shutil.copytree('.probe/release/ui-dist','server/astrodeck/webui')"
      - name: Build and smoke-test the frozen native engine and server
        shell: bash
        run: |
          NATIVE_WHEEL=$(python -c "from pathlib import Path; xs=list(Path('dist').glob('*.whl')); assert len(xs)==1; print(xs[0].as_posix())")
          python packaging/build_binary.py --skip-ui --native-wheel "$NATIVE_WHEEL"
      - name: Record actual frozen build inputs
        shell: bash
        run: python tools/licence/release_provenance.py --artifact "${{ matrix.path }}" --build-dir .probe/release/pyi --report .probe/release/frozen-provenance.json
      - name: Gate native wheel and frozen payload before upload
        shell: bash
        run: |
          NATIVE_WHEEL=$(python -c "from pathlib import Path; xs=list(Path('dist').glob('*.whl')); assert len(xs)==1; print(xs[0].as_posix())")
          python tools/licence/audit_release.py --kind native-wheel --artifact "$NATIVE_WHEEL" --platform "${{ matrix.platform }}" --credits .probe/release/credits.generated.json --report .probe/release/native-gate.json
          python tools/licence/audit_release.py --kind frozen --artifact "${{ matrix.path }}" --platform "${{ matrix.platform }}" --ui-inventory .probe/release/ui-inventory.json --credits .probe/release/credits.generated.json --build-provenance .probe/release/frozen-provenance.json --report .probe/release/frozen-gate.json
      - name: Name the accepted executable
        shell: bash
        run: mv "${{ matrix.path }}" "dist/${{ matrix.asset }}"
      - name: Retain accepted platform files
        uses: actions/upload-artifact@v4
        with:
          name: accepted-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/${{ matrix.asset }}
            dist/*.whl
      - name: Retain platform gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            .probe/release/native-gate.json
            .probe/release/frozen-gate.json

  publish:
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download only accepted payloads
        uses: actions/download-artifact@v4
        with:
          pattern: accepted-*
          merge-multiple: true
          path: dist
      - name: Sign the accepted source tarball
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          python -m pip install "cryptography>=50.0.0"
          python scripts/sign_release.py "dist/astrodeck-${GITHUB_REF_NAME#v}.tar.gz"
      - name: Checksum every accepted executable and wheel
        shell: bash
        run: |
          python -c "from pathlib import Path; import hashlib; xs=[p for p in Path('dist').iterdir() if p.is_file() and (p.suffix=='.whl' or p.name.startswith(('astrodeck-linux-','astrodeck-windows-','astrodeck-macos-')))]; assert len(xs)==8, 'expected four wheels and four executables'; [p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n',encoding='utf-8') for p in xs]"
      - name: Publish only the fully accepted release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/astrodeck-*.tar.gz
            dist/astrodeck-*.tar.gz.sha256
            dist/astrodeck-*.tar.gz.sig
            dist/astrodeck-linux-*
            dist/astrodeck-windows-*
            dist/astrodeck-macos-*
            dist/*.whl
            dist/*.whl.sha256
            dist/astrodeck-sbom.cdx.json

  # The image installs the release's own native wheels (the ones the binaries job
  # gated and uploaded) and is proven before it is named: it is pushed under a
  # candidate name only, the native probe runs inside that exact pushed image on
  # both architectures, and only then does the version tag and :latest appear
  # (#655). Nothing user-visible exists before the probe passes. The inventory
  # gate over what the image adds beyond its base is #655 part B, not yet here.
  image:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPO: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Outside the workspace on purpose: this folder also receives the two frozen
      # binaries, which must not be sent to the build as part of its context.
      - name: Download the accepted linux payloads
        uses: actions/download-artifact@v4
        with:
          pattern: accepted-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/accepted
      - name: Stage only the native wheels as the image's native build context
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/native-wheels"
          cp "$RUNNER_TEMP"/accepted/astrodeck_native-*.whl "$RUNNER_TEMP/native-wheels/"
          ls -l "$RUNNER_TEMP/native-wheels"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # REQUIRE_NATIVE=1: a missing or refused wheel fails this build instead of
      # producing a development image. The Dockerfile's own build-time probe has
      # already run once per platform by the time this step succeeds.
      - name: Build and push the candidate image
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            native=${{ runner.temp }}/native-wheels
          build-args: |
            REQUIRE_NATIVE=1
          push: true
          tags: ${{ env.IMAGE_REPO }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
      # The probe runs the pushed image itself, by digest, on both architectures
      # (arm64 under QEMU). The printed verdict is asserted, not only the status, and
      # it reaches the log before it is judged: the probe reports WHY it failed (an
      # error type) on stdout, which a captured `$(...)` under `bash -e` would discard
      # together with the failing step.
      - name: Probe the native engine in the pushed image on both architectures
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.candidate.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "native probe on $platform"
            verdict=$(mktemp)
            docker run --rm --platform "$platform" "$IMAGE" python /opt/native_probe.py | tee "$verdict"
            grep -F '"native_available": true' "$verdict" > /dev/null
          done
      # The same digest that was probed, never a rebuild.
      - name: Give the probed image its release names
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.candidate.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMAGE_REPO:$REF_NAME" --tag "$IMAGE_REPO:latest" "$IMAGE"
