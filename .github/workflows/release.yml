name: release

# Cut a release by bumping astrodeck.__version__ + pyproject, committing, then:
#   git tag v0.2.0 && git push origin v0.2.0
# This builds the UI, bundles a signed artifact, and publishes a GitHub Release.
# The scope's self-update poller consumes the published artifact + .sig + .sha256.

on:
  push:
    tags: ['v*']
  # Re-run a release build without re-tagging. A tag push is a one-shot trigger,
  # so a run that fails for a reason unrelated to the code — a billing block, a
  # runner outage — would otherwise mean deleting and re-pushing the tag. Select
  # the TAG as the ref when dispatching; every step reads github.ref_name, which
  # is the tag name either way.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate every release on the self-update apply + rollback path, on BOTH the
  # current Windows rig and Linux (spec section 8). A failure here blocks publish.
  selftest:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Real-I/O apply + verify-reject + launcher/health probe
        run: pytest -m selftest -q
      - name: Supervisor swap + rollback state machine
        run: pytest tests/test_supervisor.py tests/test_supervisor_protocol_parity.py -q

  release:
    needs: selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps
        run: pip install "cryptography>=50.0.0"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import sys; sys.path.insert(0,'server'); import astrodeck; print(astrodeck.__version__)")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG does not match astrodeck.__version__ $PKG (bump the version before tagging)"
            exit 1
          fi

      # The pack that 0.2.18 shipped without. It is git-ignored and ~45 MB, so
      # it does not exist until someone fetches it, and on 0.2.18 nobody did:
      # the box booted with online fetch off (the correct offline-first default)
      # and no local tiles, so every tile 404'd and the Atlas was simply black
      # (#100). Fetching it HERE is what makes --strict below able to fail on it.
      # If a mirror outage ever blocks a hotfix, the escape hatch is an explicit
      # `--allow-missing survey-pack`, which puts the omission in the shipped
      # manifest.json — not deleting this step.
      - name: Fetch the baseline survey pack (DSS2-color order 3)
        run: |
          # the fetcher IS the package (astrodeck.catalog.survey_pack, which
          # imports the hub), so it needs the install the build steps skip.
          pip install -e ./server
          python -m astrodeck.catalog.survey_pack fetch --order 3 --dest release-assets/dss2color

      # --strict, because the default is to WARN and ship anyway, and a tag push
      # is unattended by definition — nobody is reading this log. It fails the
      # build on any asset a complete release has and this one does not, whether
      # or not the command line asked for it, and names what each omission costs.
      #
      # ASTAP is the one deliberate hole, and --allow-missing states it here and
      # in the shipped manifest.json instead of leaving it to be found on the
      # box. Two things are unsettled, both outside this workflow: this tarball
      # is OS-agnostic while solve/astap.py::_bundled_candidates reads ONE flat
      # vendor/astap dir, so there is no single binary that is the right one to
      # put in it; and scripts/fetch_astap.py nests binaries per platform
      # (<dir>/linux-x86_64/astap_cli) with the 102 MB database flat alongside,
      # a layout the runtime cannot read. Cost, stated so a user is not left to
      # infer it: plate solving needs a separately-installed ASTAP.
      - name: Build release bundle
        run: |
          python scripts/build_release.py --strict --version "${GITHUB_REF_NAME#v}" --out dist \
            --survey-pack release-assets/dss2color \
            --allow-missing astap

      - name: Sign artifact (Ed25519 + SHA256 sidecars)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python scripts/sign_release.py "dist/astrodeck-${GITHUB_REF_NAME#v}.tar.gz"

      # Software bill of materials for the release (OPEN-006): a CycloneDX
      # inventory of the Python, npm, and Rust dependencies actually present in
      # the built tree, published alongside the artifact so a consumer can audit
      # exactly what shipped.
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/astrodeck-sbom.cdx.json
          upload-release-assets: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/astrodeck-*.tar.gz
            dist/astrodeck-*.tar.gz.sha256
            dist/astrodeck-*.tar.gz.sig
            dist/astrodeck-sbom.cdx.json

  # Single-file binaries: download one thing, run it, no Python install.
  #
  # PyInstaller cannot cross-compile, so each artefact is built on the OS AND
  # architecture it targets — that is what the matrix is for, not parallelism.
  # An arm64 macOS binary tells you nothing about an arm64 Linux one: same
  # instruction set, different OS, libc and bootloader. So the Raspberry Pi
  # needs its own row, not a Mac.
  #
  # Runner cost: macOS bills at 10x and arm64 Linux is free only on PUBLIC
  # repos, so this job runs on a release tag only, never on a push.
  #
  # build_binary.py SMOKE-TESTS what it produced (starts it, checks /healthz,
  # the SPA, and that the device backends registered). A binary that builds and
  # does not run is the normal failure mode here, so "it compiled" is not a
  # result worth publishing on.
  binaries:
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: astrodeck-linux-x86_64
            path: dist/astrodeck
          - os: ubuntu-24.04-arm      # native arm64 => the Raspberry Pi binary
            asset: astrodeck-linux-arm64
            path: dist/astrodeck
          - os: windows-latest
            asset: astrodeck-windows-x86_64.exe
            path: dist/astrodeck.exe
          - os: macos-latest          # arm64 runner => an Apple-silicon binary
            asset: astrodeck-macos-arm64
            path: dist/astrodeck
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build + smoke-test the binary
        run: python packaging/build_binary.py
      - name: Name the artefact for its platform
        shell: bash
        run: mv "${{ matrix.path }}" "dist/${{ matrix.asset }}"
      - name: Checksum
        shell: bash
        run: cd dist && shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  # Multi-arch container image (amd64 for a mini-PC, arm64 for a Raspberry Pi).
  # Published to GHCR alongside the release so `docker pull` needs no build.
  image:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # arm64 emulation for the Pi image
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
