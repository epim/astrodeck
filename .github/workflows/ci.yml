name: ci

on:
  # Run CI on demand without inventing a dummy commit. Needed in practice: CI
  # was disabled for a stretch, and re-enabling it left no way to verify the
  # backlog until something happened to land on a non-ignored path.
  workflow_dispatch:
    inputs:
      binary_smoke:
        description: 'build and smoke-test the Windows binary on the hosted runner'
        type: boolean
        default: false
  push:
    branches: [main]
    # A docs- or scratch-only push should not spend five jobs (one of them
    # Windows, which bills at 2x). Code paths only.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.remember/**'
      - 'tools/ux/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.remember/**'
      - 'tools/ux/**'

# Supersede in-flight runs for the same ref. Pushing a follow-up commit thirty
# seconds later used to pay for BOTH runs; now the first is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache defaults to globbing **/requirements.txt and
          # ERRORS when nothing matches. Deps here live in pyproject.toml, so the
          # path is explicit -- an over-clever cache that fails the build is worse
          # than no cache at all.
          cache-dependency-path: '**/pyproject.toml'
      - run: pip install -e ".[dev]"
      # -n auto overrides the repo addopts' -n 12 (tuned for the multi-core dev
      # box): hosted runners have 2-4 cores, and 12 workers oversubscribes them
      # enough to consistently trip wall-clock perf gates (test_render_perf_768).
      - run: pytest -q -n auto
      # Dependency vulnerability gate (OPEN-006). pip-audit fails the build on a
      # known-vulnerable installed dependency; local editable packages
      # (astrodeck, astrodeck-native) are skipped, not failed. Runs AFTER the
      # tests so installing the audit tool cannot perturb the environment the
      # tests just graded.
      - name: pip-audit (fail on a vulnerable dependency)
        run: |
          pip install pip-audit
          pip-audit

  # The setter and the independent verifier both call Win32 directly, so a
  # Linux-only unit lane cannot establish that protected DACLs really persist.
  # Run the contract on NTFS for every change; only the symlink assertion may
  # skip when the hosted identity lacks Create symbolic links privilege.
  windows-private-state:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'server/pyproject.toml'
      - run: pip install -e "./server[dev]"
      - name: Portable ACL orchestration regressions
        run: >-
          python -m pytest -q -p no:cacheprovider
          server/tests/test_windows_private_acl.py
          server/tests/test_persist.py
      - name: Live NTFS protected-DACL gate
        run: >-
          python -m pytest -q -p no:cacheprovider
          security_acceptance/test_windows_acl_contract.py
          --run-security-acceptance --run-security-live

  # Host-safe regressions for the Orange Pi appliance portal and recovery
  # policy. Hardware validation still runs on a real board before release, but
  # these checks prevent credential, HTTP-boundary and systemd-policy drift on
  # every ordinary CI run.
  orangepi-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pytest>=8.0'
      - name: Orange Pi unit and portable acceptance gates
        run: >-
          python -m pytest -q -p no:cacheprovider
          orangepi5/tests security_acceptance/test_orangepi_contract.py
          --run-security-acceptance -m "not security_live"


  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache defaults to globbing **/requirements.txt and
          # ERRORS when nothing matches. Deps here live in pyproject.toml, so the
          # path is explicit -- an over-clever cache that fails the build is worse
          # than no cache at all.
          cache-dependency-path: '**/pyproject.toml'
      # install the relay package + dev extras (pytest, pytest-asyncio, httpx --
      # Starlette's TestClient needs httpx, which requirements.txt omits)
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Dependency vulnerability gate (OPEN-006), after the tests so the audit
      # tool's install cannot perturb the environment the tests just graded.
      - name: pip-audit (fail on a vulnerable dependency)
        run: |
          pip install pip-audit
          pip-audit

  # Container isolation has architecture-specific release requirements: the
  # image must be exercised by a native Linux kernel on both the ordinary
  # amd64 host and the arm64 target used by Raspberry/Orange Pi deployments.
  # The live contract builds both runtime images, checks their numeric IDs,
  # then runs them with a read-only root, no capabilities and
  # no-new-privileges.  It also proves only the declared data volumes and
  # bounded tmpfs remain writable and that named-volume state survives a
  # replacement container.
  container-security:
    name: container-security (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract-test dependencies
        run: pip install 'pytest>=8.0' 'PyYAML>=6.0'
      - name: Validate local and USB Compose profiles
        env:
          ASTRODECK_USB_GID: '1000'
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.usb.yml config --quiet
      - name: Run native container isolation gate
        run: >-
          python -m pytest -q -p no:cacheprovider
          security_acceptance/test_container_contract.py
          --run-security-acceptance --run-security-live

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      # Pinned to Node 22.15+ (see issue #61): `npm test` spawns test files that
      # call `node:module`'s `registerHooks()` (added in v22.15.0/v23.5.0) to
      # stub out `.css` imports for jsdom, both the ~53 per-file inline stubs
      # and the runner-level `test-css-stub.mjs`. Node 20 (the previous pin)
      # has no `registerHooks` at all, so every one of those files crashed with
      # "registerHooks is not a function" before a single test in them ran.
      # '24' matches the version already used for local development (see
      # test-css-stub.mjs's header comment), so CI and dev now share one
      # tested code path instead of a fix being verified only on a developer's
      # machine and never on the Node CI actually runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # Dependency vulnerability gate (OPEN-006): production deps only, so a dev
      # tool advisory never blocks a release. Fails on a vulnerable dependency.
      - run: npm audit --omit=dev
      # The 99 UI test files gated nothing until now: each prints its own tally
      # and exits zero either way, so a failing file was visible only to somebody
      # running it by hand and reading the output. run-tests.mjs runs each in its
      # own process (they install fake globals and do not clean up) and turns the
      # result into an exit code.
      - run: npm test
      - run: npm run build

  # The Rust native engine (star detection / autofocus / TPPA / guiding) + its
  # PyO3 wheel. Without this, a Rust regression sails through and the
  # native-provider tests skip on CI (no wheel). This job gates the workspace
  # AND builds the wheel so the native test files — including the P1 guiding
  # e2e convergence gate — actually run against the real engine.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # native/ was ~4 of the ~14 billed minutes per run, almost all of it
      # recompiling unchanged crates. This is the single biggest saving.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # Dependency vulnerability gate (OPEN-006 / OPEN-013). Plain `cargo audit`
      # fails on a VULNERABILITY but only warns (exit 0) on the unmaintained
      # `paste` crate (RUSTSEC-2024-0436) -- kept release-visible in the log and
      # tracked in OPEN-013 until nalgebra drops it.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: native
        run: cargo audit
      - name: cargo fmt
        working-directory: native
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        working-directory: native
        run: |
          cargo test --workspace
          cargo test -p astro-star --features parallel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache defaults to globbing **/requirements.txt and
          # ERRORS when nothing matches. Deps here live in pyproject.toml, so the
          # path is explicit -- an over-clever cache that fails the build is worse
          # than no cache at all.
          cache-dependency-path: '**/pyproject.toml'
      - name: Build the astrodeck_native wheel (maturin)
        run: |
          pip install "maturin>=1.5,<2.0"
          maturin build --release -m native/crates/astrodeck-native/Cargo.toml -o wheels
      - name: Install wheel + server, run native-engine tests (else skipped on CI)
        run: |
          pip install -e "./server[dev]"
          pip install --no-index --find-links wheels astrodeck-native
          cd server && pytest tests/test_native_module.py tests/test_autofocus_native.py tests/test_polar_native.py tests/test_native_guide_surface.py tests/test_native_guider_e2e.py tests/test_native_guider_dither.py tests/test_native_guider_recovery.py tests/test_native_guider_algorithms.py tests/test_native_guider_ppec.py tests/test_native_guider_unattended_night.py -q
          # The sequence engine's autofocus-sweep tracking guard runs on the
          # native V-curve engine; these five skip on the wheel-less server job
          # and are graded HERE, by node id (the rest of that file is a slow
          # real-time flip harness that the server job already runs).
          pytest -q "tests/test_flip_before_the_limit.py::test_the_engines_sweep_aborts_when_tracking_dies_mid_way" "tests/test_flip_before_the_limit.py::test_a_dark_frame_sweep_is_not_gated_on_tracking" "tests/test_flip_before_the_limit.py::test_one_sampled_dropout_does_not_abandon_a_sweep" "tests/test_flip_before_the_limit.py::test_a_dropout_that_lasts_is_still_believed" "tests/test_flip_before_the_limit.py::test_a_calibration_target_sweep_is_not_gated_on_tracking"

  # The bundled COM host (ascom-local) — the Windows-only COM->Alpaca path.
  #
  # HONESTY NOTE (COM-T7): the real "single-install" acceptance gate
  # (test_ascom_local_gate.py) drives the ASCOM *Simulator* drivers, which only
  # exist once the ASCOM Platform is installed. Hosted GitHub Windows runners have
  # NO ASCOM Platform / NO simulator drivers / NO comtypes runtime COM, so the gate
  # + simulator tests SKIP here (skips are not failures — a green job does NOT imply
  # simulator coverage; the log shows the skips). What this job DOES prove, that no
  # Linux job can, is the Windows-native surface: winreg registry enumeration, the
  # real `python -m astrodeck.comhost` subprocess spawn/health/teardown lifecycle,
  # taskkill/tasklist no-orphan reaping, and the degrade row inverting to PRESENT on
  # Windows. The true end-to-end simulator proof is the operator's on-ASCOM-box run
  # documented in docs/comhost.md (the astrotown validation checklist).
  windows-com:
    # Windows bills at 2x, and this job was 21% of the total spend for 10% of the
    # wall clock. It guards the COM/ASCOM host, which only Windows can exercise --
    # valuable, but not on every branch push. Runs on main and on tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache defaults to globbing **/requirements.txt and
          # ERRORS when nothing matches. Deps here live in pyproject.toml, so the
          # path is explicit -- an over-clever cache that fails the build is worse
          # than no cache at all.
          cache-dependency-path: '**/pyproject.toml'
      # Best-effort ASCOM Platform install (registers the Simulators). Hosted
      # runners usually cannot (no admin/GUI installer), so this is allowed to fail
      # and the gate + simulator tests then SKIP — acceptable, documented degradation.
      - name: Install ASCOM Platform (best effort; registers the Simulators)
        continue-on-error: true
        run: choco install ascom-platform -y --no-progress
      - run: pip install -e ".[dev,comhost]"
      # -n auto matches the server job (hosted runners have few cores). The gate +
      # simulator files SKIP without the Platform; the rest (registry/mapping/harness/
      # contract/manager/backend/degrade + the real-subprocess lifecycle) run for real.
      - run: >-
          pytest -q -n auto
          tests/test_ascom_registry.py
          tests/test_comhost_alpaca_contract.py
          tests/test_comhost_sta_harness.py
          tests/test_comhost_telescope_camera_map.py
          tests/test_comhost_aux_map.py
          tests/test_comhost_misc_map.py
          tests/test_comhost_fault_eviction.py
          tests/test_comhost_manager.py
          tests/test_ascom_local_backend.py
          tests/test_discover_ascom_local.py
          tests/test_ascom_local_absent_off_windows.py
          tests/test_ascom_local_gate_meta.py
          tests/test_comhost_simulators.py
          tests/test_ascom_local_gate.py
          -rs

  # Proof that the release workflow's windows-latest binary leg can smoke-test
  # what it builds. Hosted Windows runners hand every process an elevated
  # Administrator token and the server refuses to start elevated (OPEN-005), so
  # build_binary.py runs the binary as a throwaway unprivileged local account
  # (CreateProcessWithLogonW), which needs an elevated caller to create.
  # (`runas /trustlevel:0x20000` was tried first and does not work: the SAFER
  # token keeps TokenIsElevated set and the server still refuses.)
  #
  # PROVEN ON REAL HARDWARE, 2026-09-07: the whole elevated path ran on a
  # Windows 11 box through an SSH session whose token is elevated -- account
  # created, /healthz served by the binary at its own version, SPA served,
  # ten backends registered, then the account, its profile, the ACEs and the
  # window-station grant all taken back off. That run is also what found the
  # window-station defect: every child of CreateProcessWithLogonW was dying
  # at 0xC0000142 before its first instruction -- `whoami.exe` as surely as
  # the binary -- because a logon that is not interactive gets a window
  # station of its own that a brand-new account cannot open.
  #
  # STILL UNPROVEN: this job. A hosted runner is elevated the same way but is
  # not an SSH logon, so its window station may differ again. The first
  # dispatch is a real test, not a formality.
  #
  # DISPATCH-ONLY ON PURPOSE. Windows bills at 2x and this is a full UI build +
  # PyInstaller run (~20 min). It is a proof to be run when the smoke harness
  # changes, not a gate on every push -- the release workflow is where it
  # actually has to hold, and this job exists so that can be verified without
  # cutting a tag. Run it from the Actions tab with "binary smoke" ticked.
  binary-smoke-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.binary_smoke
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No artefact upload: the question this job answers is whether the smoke
      # test passes, and release.yml is what publishes binaries.
      - name: Build + smoke-test the binary
        run: python packaging/build_binary.py
