name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site/**"
      - "tools/privacy_scan.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/site/**"
      - "tools/privacy_scan.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install HTML5 validator
        run: python -m pip install -r tools/site/requirements.txt
      - name: Refuse the real observing site
        env:
          ASTRODECK_PRIVACY_NEEDLES: ${{ secrets.ASTRODECK_PRIVACY_NEEDLES }}
        run: |
          if [ -z "$ASTRODECK_PRIVACY_NEEDLES" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "privacy: no secret available; fork check skipped."
              exit 0
            fi
            echo "privacy: ASTRODECK_PRIVACY_NEEDLES is required before publishing."
            exit 1
          fi
          python tools/privacy_scan.py --require
          python tools/site/check_site.py --privacy --require-privacy
      - name: Test the checks
        run: python -m unittest discover -s tools/site -p "test_*.py"
      - name: Validate HTML, assets, internal links and house style
        run: python tools/site/check_site.py
      - name: Validate JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find site -name '*.js' -print0)
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Repository owner enables Pages with GitHub Actions before the first run.
      # No automatic enablement or repository settings mutation.
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - id: deployment
        uses: actions/deploy-pages@v5
