name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Every page must link a stylesheet that exists
        run: |
          cd site
          fail=0
          for f in *.html; do
            for ref in $(grep -oE '(href|src)="assets/[^"]+"' "$f" | sed -E 's/.*"(assets[^"]+)"/\1/'); do
              if [ ! -f "$ref" ]; then
                echo "$f references missing $ref"
                fail=1
              fi
            done
          done
          exit $fail

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
