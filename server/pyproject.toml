[project]
name = "astrodeck"
version = "0.1.0"
description = "Open multi-vendor astrophotography controller (ASIAIR replacement)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "astropy>=6.0",
    "astropy-healpix>=1.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "bcrypt>=4.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run in parallel by default (pytest-xdist). Full suite ~800s serial -> ~250s at
# -n 12. Capped at 12 (NOT `-n auto`) on purpose: the heavy native-guiding timing
# tests (test_native_guider_ppec / test_native_guider_recovery) hold real compute
# + timing loops, and oversubscribing every core under concurrent load can starve
# them into a multi-minute hang (observed once at ~30 workers). Each xdist worker
# is its own process, so the process-wide hub singleton stays isolated per worker
# (see conftest's _reset_hub_singleton_locks). Use `-n0` for interactive debugging
# (--pdb / clean -x / live output); `-n auto` is fine on an otherwise-idle box.
addopts = "-n 12"
markers = [
    "selftest: real-I/O end-to-end self-update checks (CI runs on win+linux)",
]

[tool.setuptools.packages.find]
include = ["astrodeck*"]
