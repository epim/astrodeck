[project]
name = "astrodeck"
version = "0.3.16"
description = "Open, vendor-neutral astrophotography controller for your whole imaging rig"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "astropy>=6.0",
    "astropy-healpix>=1.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "bcrypt>=4.1",
    "cryptography>=42.0",
    "packaging>=23.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-xdist>=3.6"]
# Bundled Windows COM->Alpaca host (astrodeck.comhost). comtypes is Windows-only
# (marker-gated) so Mac/Linux installs never pull it; the Windows bundle installs
# `.[comhost]`. Absent comtypes -> the host/registry modules degrade (import
# guards) and ascom-local is simply not offered.
comhost = ["comtypes>=1.4.0; sys_platform == 'win32'"]
# ZWO ASIAIR backend (astrodeck.devices.backends.asiair_backend). libasi is MIT
# and stdlib-only, but it is NOT ON PyPI — so this extra names it by VCS URL and
# `pip install -e .` without the extra is unaffected. Absent libasi the backend
# module still imports, `register_all()` registers nothing, and `asiair` is
# simply not an offered backend or driver type (import guards, same idiom as
# comhost/comtypes above).
#
# THE URL MOVED, AND THE OLD ONE 404s (#201, corrected 2026-08-08). It pointed at
# github.com/jewzaam/libasi, which no longer exists — verified against the GitHub
# API, not the browser, so a private repo would have looked different from a
# deleted one. For however long that was true, `pip install -e .[asiair]` failed
# outright: the ASIAIR backend was undeployable by the documented path, and the
# "libasi is MIT" claim beside it could not be checked against anything.
#
# Upstream is github.com/epim/libasi. Identified by what it contains rather than
# by its name: it is the only repository carrying CONFIRMED_FORMATS.md (the file
# asiair_backend.py's docstring cites), its package directory is `asiair/`
# exporting the `ASIAIRClient` the backend imports, and its own
# [project.urls] Repository still points at the dead jewzaam URL — which is where
# the stale address in this file came from.
#
# LICENCE RE-VERIFIED FROM THE LIVE SOURCE, which is the half of this that a
# 404 made impossible: github.com/epim/libasi is public, not a fork, and its
# LICENSE is a verbatim MIT text ("Copyright (c) 2026 libasi contributors").
# The GitHub API reports spdx_id "MIT". tools/licence_texts/libasi.txt already
# carries that identical text.
asiair = ["libasi @ git+https://github.com/epim/libasi"]
# GOES cloud-occlusion granule reader (astrodeck.cloudmap.granule). h5py is
# BSD-3-Clause and its only requirement is numpy, already a hard dependency, so
# this extra costs no platform reach: h5py's wheel coverage IS numpy's, save
# win32, and 32-bit Windows was never a target (the vendored camera DLLs are
# x64). 32-bit ARM was already out of reach before this stage existed — numpy
# put it there — so the Orange Pi appliance, Raspberry Pi OS 64-bit and Ubuntu
# arm64 all install this cleanly.
#
# Absent h5py the module still imports, `HAVE_H5PY` is False and every entry
# point raises CloudmapUnavailable naming THIS extra by name — so the key here
# and the string in granule.py::_require_h5py have to stay the same word.
# test_the_extra_that_the_error_message_names_exists reads this file and
# asserts exactly that, because for one review round the message told users to
# run `pip install 'astrodeck[cloudmap]'` against an extra that did not exist:
# pip warns "does not provide the extra", installs nothing, exits 0, and the
# next run prints the identical instruction again.
cloudmap = ["h5py>=3.10"]

[project.entry-points."astrodeck.backends"]
# Native drivers register through the SAME entry-point path an external plugin
# would use — dogfooding the driver framework's discovery.
zwo_am5 = "astrodeck.devices.backends.zwo_am5:register_all"
zwo_usb = "astrodeck.devices.backends.zwo_usb:register_all"
wanderer_snowflake = "astrodeck.devices.backends.wanderer_snowflake:register_all"
zwo_asi = "astrodeck.devices.backends.zwo_asi:register_all"
player_one = "astrodeck.devices.backends.player_one:register_all"
# Registers ONLY when libasi is importable — a user without an ASIAIR sees no
# change at all (no backend row, no `asiair` driver type).
asiair = "astrodeck.devices.backends.asiair_backend:register_all"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Run in parallel by default (pytest-xdist). Full suite ~800s serial -> ~250s at
# -n 12. Capped at 12 (NOT `-n auto`) on purpose: the heavy native-guiding timing
# tests (test_native_guider_ppec / test_native_guider_recovery) hold real compute
# + timing loops, and oversubscribing every core under concurrent load can starve
# them into a multi-minute hang (observed once at ~30 workers). Each xdist worker
# is its own process, so the process-wide hub singleton stays isolated per worker
# (see conftest's _reset_hub_singleton_locks). Use `-n0` for interactive debugging
# (--pdb / clean -x / live output); `-n auto` is fine on an otherwise-idle box.
#
# WORKER COUNT stays 12 (see above) -- the starvation cap is unchanged.
#
# `--dist worksteal` (xdist >= 3.2) replaces the default `load` SCHEDULER. This
# is a distribution strategy only: same workers, same tests, same per-test
# behaviour, nothing about isolation or ordering-within-a-worker changes.
# `load` front-loads a large initial batch round-robin and then hands out the
# rest one at a time, so a worker that draws several of this suite's
# multi-second device/solve/guiding tests finishes long after the others and
# the whole run waits on that tail. That tail is also chaotically sensitive to
# per-test durations: making the sim solver's pacing sleep fake (this phase)
# LOWERED total test CPU by ~35 s yet pushed `load`'s wall clock from ~124 s to
# ~188 s purely by reshuffling which worker drew the tail. `worksteal` lets an
# idle worker take pending items back off a busy one, which removes both the
# tail and the sensitivity -- measured on this box (24 logical CPUs), full
# suite, same code: load 124 s vs worksteal 100 s BEFORE this phase's changes,
# and load 188 s vs worksteal 101 s after. It is strictly a scheduling fix, so
# it helps independently of anything else here.
addopts = "-n 12 --dist worksteal"
markers = [
    "selftest: real-I/O end-to-end self-update checks (CI runs on win+linux)",
    # Fast/slow lane. `pytest -m 'not slow'` is the inner loop; CI and every
    # gate keep running the FULL suite (no marker filter), so `slow` never
    # means "optional" -- it means "this test deliberately spends wall clock on
    # timing realism (real device dwell, a real grace period, a long
    # logical-time guiding run) rather than on assertions you can get faster".
    "slow: deliberately wall-clock-bound (timing-realism / long guiding runs)",
    # Drives real I/O or a real second process (sockets, subprocesses, the
    # relay lane) rather than in-process fakes. Disjoint from `slow` in intent:
    # a test can be one, both, or neither.
    "integration: exercises real I/O or a real second process end to end",
]

[tool.setuptools.packages.find]
include = ["astrodeck*"]

# Vendored SDK binaries + their licenses must ship INSIDE the installed package
# (a non-editable `pip install` otherwise drops them, and the drivers silently
# fall back to a system SDK install — defeating the zero-vendor-software goal).
# The loader reads them relative to the installed __file__ (devices/*_sdk.py:
# _VENDOR_DIR), so they must land in site-packages/astrodeck/vendor/.
[tool.setuptools.package-data]
astrodeck = [
    "vendor/zwo/*.dll",
    "vendor/zwo/*.txt",
    "vendor/zwo/*.md",
    "vendor/playerone/*.dll",
    "vendor/playerone/LICENSE",
    "vendor/playerone/*.md",
    # Per-platform shared libraries (devices/sdk_paths.py). The Linux files are
    # fully-versioned (libFoo.so.3.10.0) because a vendor ships the short names
    # as SYMLINKS, and a symlink survives neither a Windows checkout nor a wheel
    # build — so the glob must not assume a `.so` suffix comes last.
    "vendor/*/linux-*/*",
    "vendor/*/macos/*",
    # The deep-sky catalogue (OpenNGC extract, tools/build_ngc_catalog.py).
    # objects.py reads it relative to its own __file__ and degrades to the 64
    # curated rows if it is missing — which is a silent, invisible failure for
    # anyone searching a name that used to work, so it must ship.
    "catalog/data/*.tsv",
]
